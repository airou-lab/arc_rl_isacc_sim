[pytest]
addopts = -p no:launch_testing -p no:launch_ros -p no:launch_testing_ros -p no:launch_testing_ros_pytest_entrypoint -p no:ament_lint -p no:ament_xmllint -p no:ament_flake8 -p no:ament_pep257 -p no:ament_copyright --ignore=tests/test_deterministic_reach.py --ignore=tests/test_manual_left_turn.py --ignore=tests/test_physics_rule_based.py --ignore=tests/test_sector2_runway.py
testpaths = tests
markers =
    cpu: Pure-CPU deterministic invariant and unit tests (no Isaac Sim required)
    isaac: Full Isaac Sim / GPU integration tests
    isaac_sim: Full Isaac Sim / GPU integration tests
